<style>
:root{--ink:#14181F;--blue:#2B57A7;--red:#D83A3A;--sun:#FCBF17;--paper:#F7F8FA;--line:#E3E6EC;--ok:#1a9e6b}
*{box-sizing:border-box}
body{margin:0;font-family:Raleway,"Segoe UI",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.45}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:800;font-size:21px;color:var(--ink)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;padding:8px 12px;border-radius:6px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer}
nav button.on{background:var(--blue);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{margin:0 0 12px;font-size:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:#555}
.alert{border-left:4px solid var(--red);background:#fdeeee;border-radius:6px;padding:10px 12px;margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.tile{position:relative;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 10px 10px 16px;cursor:pointer;font:inherit;color:var(--ink)}
.tile i{position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:8px 0 0 8px}
.tile .n{font-size:24px;font-weight:800}
.tile small{display:block;color:#555}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:1px 6px;border-radius:4px;background:#eef1f6}
label{display:block;font-size:14px;font-weight:600;margin:10px 0 0}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;margin-top:4px;background:#fff}
input[type=checkbox]{width:auto;margin:0 6px 0 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.p,button.s{border:0;border-radius:6px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;margin-top:14px}
button.p{background:var(--blue);color:#fff}
button.s{background:#fff;border:1px solid var(--line);color:var(--ink);margin-left:6px}
button.d{background:var(--red);color:#fff;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;text-align:left;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
dialog{border:0;border-radius:10px;padding:18px;max-width:480px;width:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.sum{background:var(--paper);border-radius:8px;padding:10px;margin-top:12px}
.sum div{display:flex;justify-content:space-between}
.muted{color:#666;font-size:13px}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
[hidden]{display:none!important}.chip:empty{display:none}@media(max-width:700px){nav{order:9;width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}nav button{white-space:nowrap;flex:none}.logo{height:26px}.bar{padding:8px 12px;gap:8px}}a.btn{display:inline-block;border-radius:6px;padding:10px 16px;font-weight:700;text-decoration:none;margin:6px 6px 0 0}a.btn.b{background:var(--blue);color:#fff}a.btn.y{background:var(--sun);color:var(--ink)}details summary{cursor:pointer;font-weight:700;color:var(--blue);margin-top:10px}
header{border-bottom:0}header:after{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--blue) 0 34%,var(--red) 34% 67%,var(--sun) 67%)}
.logo{height:36px;width:auto;flex:none;margin-left:auto}
.kpis .card:nth-child(4n+1){border-top:4px solid var(--blue)}.kpis .card:nth-child(4n+2){border-top:4px solid var(--red)}.kpis .card:nth-child(4n+3){border-top:4px solid var(--sun)}.kpis .card:nth-child(4n){border-top:4px solid var(--ink)}
.subs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.subs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}.subs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:20}
@media print{header,button,label,#toast,dialog{display:none!important}body{background:#fff}}
</style>

<script>
/* ===== Stockage local : tout reste dans ce navigateur (IndexedDB), aucun serveur ===== */
let S={rooms:[],bookings:[],payments:[],tasks:[],shifts:[],lastClose:0,cfg:null,watch:[],lastBackup:0,lastCloseBy:{},cur:''};
const idb=()=>new Promise((ok,ko)=>{const r=indexedDB.open('aura-stays',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const load=async()=>{const db=await idb();return new Promise(ok=>{const q=db.transaction('kv').objectStore('kv').get('state');q.onsuccess=()=>ok(q.result)})};
const save=async()=>{const db=await idb();db.transaction('kv','readwrite').objectStore('kv').put(S,'state')};
const kvGet=async k=>{const db=await idb();return new Promise(ok=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result)})};
const kvSet=async(k,v)=>{const db=await idb();db.transaction('kv','readwrite').objectStore('kv').put(v,k)};

/* ===== Outils ===== */
const $=s=>document.querySelector(s);
const uid=()=>crypto.randomUUID(), now=()=>Date.now();
const fmt=n=>(n||0).toLocaleString('fr-FR')+' F';
const when=t=>new Date(t).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const METHODS={especes:'Espèces',orange_money:'Orange Money',mtn_momo:'MTN MoMo',wave:'Wave',moov:'Moov',carte:'Carte'};
const KINDS={simple:'Chambre simple',vip:'Chambre VIP',suite:'Suite',appartement:'Appartement meublé',studio:'Studio'};
const AMEN={clim:'Climatisation',canal:'Canal+',wifi:'WiFi',jacuzzi:'Jacuzzi',balcon:'Balcon'};
const CHECK=['Climatisation','Télévision / Canal+','Literie et linge','Salle de bain','Mobilier'];
const ST={libre:['Libre','#1a9e6b'],occ_n:['Occupée (nuitée)','#2B57A7'],occ_p:['Occupée (passage)','#FCBF17'],nettoyage:['En nettoyage','#4aa8d8'],maintenance:['En maintenance','#D83A3A']};
const room=id=>S.rooms.find(r=>r.id===id), bk=id=>S.bookings.find(b=>b.id===id);
const active=r=>S.bookings.find(b=>b.room===r.id&&b.status==='en_cours');
const status=r=>r.maintenance?'maintenance':active(r)?(active(r).stay==='nuitee'?'occ_n':'occ_p'):S.tasks.some(t=>t.room===r.id&&!t.done)?'nettoyage':'libre';
const sum=a=>a.reduce((s,x)=>s+x,0);
const paidOf=id=>sum(S.payments.filter(p=>p.b===id&&(p.kind==='acompte'||p.kind==='solde')).map(p=>p.amount));
const heldOf=id=>sum(S.payments.filter(p=>p.b===id).map(p=>p.kind==='caution'?p.amount:p.kind==='remboursement'?-p.amount:0));
const day0=()=>new Date().setHours(0,0,0,0);

/* ===== Tarification ===== */
function nightsPrice(r,start,n){let t=0;for(let i=0;i<n;i++){const d=new Date(start+i*864e5).getDay();t+=([5,6].includes(d)&&r.pWe)?r.pWe:(r.pNight||0)}return t}
const passageOver=(b,r,at)=>Math.ceil(Math.max(0,(at-b.in)/6e4-b.dur-S.cfg.grace)/60)*(r.pExtra||0);

/* ===== Navigation ===== */
let tab='dash';
const TABS={dash:'Tableau de bord',rec:'Réception',rooms:'Chambres',cash:'Caisse',hk:'Ménage',reg:'Registre',rep:'Rapports',set:'Paramètres'};
function go(t,pre){tab=t;render(pre)}
function render(pre){
  if(!licOK())return lock();

  const soon=occ.map(([r])=>[r,active(r)]).filter(([,b])=>b.out-now()<=30*6e4).sort((a,b)=>a[1].out-b[1].out);

function openRoom(id){
  const r=room(id),s=status(r),b=active(r);

}
function seed(){

  S.rooms=[mk('101',1,0),mk('102',1,0),mk('103',1,1),mk('104',1,1),mk('201',2,2),mk('202',2,5)];

}

function quote(){

const readImg=file=>new Promise(ok=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};im.src=fr.result};fr.readAsDataURL(file)});
async function submitCI(e){
  e.preventDefault();const f=e.target,r=room(f.room.value);if(!r)return;
  const st=f.stay.value,n=Math.max(1,+f.nights.value||1),t=now(),dur=+f.forfait.value;
  const amount=st==='nuitee'?nightsPrice(r,t,n):(dur===120?r.p2h:r.p3h)||0;
  if(!amount&&!confirm('Aucun tarif défini pour ce séjour. Continuer avec 0 F ?'))return;
  const img=f.doc.files[0]?await readImg(f.doc.files[0]):null;
  const out=st==='nuitee'?(()=>{const d=new Date(t+n*864e5);d.setHours(+S.cfg.out.split(':')[0],+S.cfg.out.split(':')[1],0,0);return +d})():t+dur*6e4;
  const b={id:uid(),room:r.id,stay:st,in:t,out,dur:st==='passage'?dur:0,nights:st==='nuitee'?n:0,amount,extra:0,status:'en_cours',
    cust:{name:f.name.value.trim(),phone:f.phone.value,nat:f.nat.value,docType:f.docType.value,docNum:f.docNum.value,img},
    issues:[...f.querySelectorAll('[name=iss]:checked')].map(x=>x.value)};
  const nm=x=>String(x||'').replace(/\s/g,'').toLowerCase();
  const wl=S.watch.find(w=>(w.phone&&nm(w.phone)===nm(b.cust.phone))||(w.docNum&&nm(w.docNum)===nm(b.cust.docNum))||(w.name&&nm(w.name)===nm(b.cust.name)));
  if(wl&&!confirm(`Attention : client à surveiller (${wl.reason}). Enregistrer quand même l'arrivée ?`))return;
  S.bookings.push(b);
  const pay=(kind,a)=>a>0&&S.payments.push({id:uid(),b:b.id,kind,method:f.method.value,amount:a,at:t,ref:f.ref.value,by:S.cur});
  pay('acompte',+f.paid.value||0);pay('caution',f.caution.checked?r.deposit||0:0);
  await save();go('dash');
}

function openCheckout(bid){
  const b=bk(bid),r=room(b.room),over=b.stay==='passage'?passageOver(b,r,now()):0;
  const total=b.amount+b.extra+over,bal=total-paidOf(bid),held=heldOf(bid);
  dlg(`<h2>Départ · Chambre ${esc(r.number)}</h2><p>${esc(b.cust.name)} — arrivée ${when(b.in)}, départ prévu ${when(b.out)}</p>
  <div class="sum"><div><span>Séjour</span><span>${fmt(b.amount)}</span></div>${b.extra?`<div><span>Prolongations</span><span>${fmt(b.extra)}</span></div>`:''}${over?`<div><span>Heures supplémentaires</span><span>${fmt(over)}</span></div>`:''}
  <div><span>Déjà payé</span><span>${fmt(paidOf(bid))}</span></div><div><b>Reste à payer</b><b>${fmt(Math.max(0,bal))}</b></div>${held?`<div><span>Caution détenue</span><span>${fmt(held)}</span></div>`:''}</div>
  <form onsubmit="doCheckout(event,'${bid}',${over})"><div class="row"><label>Montant encaissé (F)<input name="amt" type="number" min="0" value="${Math.max(0,bal)}"></label>
  <label>Mode<select name="m">${payOpts()}</select></label></div><label>Référence Mobile Money (facultatif)<input name="tx"></label>
  ${held?`<label style="font-weight:400"><input type="checkbox" name="ref" checked>Rendre la caution (${fmt(held)})</label>`:''}
  <button class="p">Valider le départ</button><button type="button" class="s" onclick="extend('${bid}')">Prolonger (+1 ${b.stay==='nuitee'?'nuit':'heure'})</button><button type="button" class="s" onclick="printReceipt('${bid}',${over})">Reçu</button><button type="button" class="s" onclick="waReceipt('${bid}',${over})">WhatsApp</button><button type="button" class="s" onclick="closeD()">Fermer</button></form>`);
}
async function doCheckout(e,bid,over){
  e.preventDefault();const f=e.target,b=bk(bid),a=+f.amt.value||0,t=now(),held=heldOf(bid);
  b.extra+=over;
  if(a>0)S.payments.push({id:uid(),b:bid,kind:'solde',method:f.m.value,amount:a,at:t,ref:f.tx.value,by:S.cur});
  if(f.ref?.checked&&held>0)S.payments.push({id:uid(),b:bid,kind:'remboursement',method:'especes',amount:held,at:t,by:S.cur});
  const left=b.amount+b.extra-paidOf(bid);
  if(left>0&&!confirm(`Il reste ${fmt(left)} impayé. Valider quand même ?`)){b.extra-=over;S.payments=S.payments.filter(p=>p.at!==t);return}
  b.status='terminee';b.outAt=t;S.tasks.push({id:uid(),room:b.room,b:bid,at:t,done:0});
  await save();closeD();render();
}
function extend(bid){
  const b=bk(bid),r=room(b.room);
  if(b.stay==='nuitee'){b.nights++;b.out+=864e5;b.amount+=nightsPrice(r,b.out-864e5,1)}else{b.dur+=60;b.out+=36e5;b.extra+=r.pExtra||0}
  save();openCheckout(bid);
}

  Séjour : ${fmt(b.amount)}<br>${b.extra+over?`Suppléments : ${fmt(b.extra+over)}<br>`:''}<b>Total : ${fmt(b.amount+b.extra+over)}</b><hr>
  ${ps.map(p=>`${p.kind} (${METHODS[p.method]}) : ${fmt(p.amount)}${p.ref?' réf. '+esc(p.ref):''}<br>`).join('')}<hr>

function fillAm(f){const t=typ(f.type.value);f.querySelectorAll('[name=amen]').forEach(c=>c.checked=!!t&&t.amen.includes(c.value))}
function saveRoom(e,id){
  e.preventDefault();const f=e.target,n=f.number.value.trim(),t=typ(f.type.value);
  const base={floor:+f.floor.value||0,type:t.id},am=[...f.querySelectorAll('[name=amen]:checked')].map(x=>x.value);
  const pr=Object.fromEntries(PR.map(k=>[k,t[k]]));
  if(id){
    if(S.rooms.some(r=>r.number===n&&r.id!==id))return alert('Ce numéro de chambre existe déjà.');
    Object.assign(room(id),{number:n,...base,amen:am,...pr});
  }else{
    const to=+(f.to?.value),from=parseInt(n);
    const nums=(to&&/^\d+$/.test(n)&&to>=from&&to-from<200)?Array.from({length:to-from+1},(_,i)=>String(from+i)):[n];
    const dup=nums.filter(x=>S.rooms.some(r=>r.number===x));
    if(dup.length)return alert('Numéro(s) déjà existant(s) : '+dup.join(', '));
    nums.forEach(x=>S.rooms.push({id:uid(),number:x,maintenance:false,...base,amen:[...am],...pr}));
  }
  save();closeD();render();
}

/* ===== Caisse ===== */
function vCash(){
  const k=S.cur||'_',since=Math.max(S.lastCloseBy[k]||0,day0()),multi=S.cfg.staff.length>0;
  const ps=S.payments.filter(p=>p.at>=since&&(!multi||p.by===S.cur));
  const cash=sum(ps.filter(p=>p.method==='especes').map(p=>p.kind==='remboursement'?-p.amount:p.amount));

function payDebt(bid){

function doPayDebt(e,bid){e.preventDefault();const f=e.target;S.payments.push({id:uid(),b:bid,kind:'solde',method:f.m.value,amount:+f.a.value,at:now(),ref:f.tx.value,by:S.cur});save();closeD();render()}
function relance(bid){

/* ===== Rapports, export, sauvegarde ===== */
let days=30;
function vRep(){
  const from=now()-days*864e5,ps=S.payments.filter(p=>p.at>=from&&(p.kind==='acompte'||p.kind==='solde')),bs=S.bookings.filter(b=>b.in>=from&&b.status!=='annulee');
  const by=m=>sum(ps.filter(p=>p.method===m).map(p=>p.amount));
  const stay=s=>bs.filter(b=>b.stay===s);const rv=s=>sum(stay(s).map(b=>b.amount+b.extra));
  return `<h2>Rapports</h2><label style="max-width:220px">Période<select onchange="days=+this.value;render()">${[[1,"Aujourd'hui"],[7,'7 jours'],[30,'30 jours'],[365,'12 mois']].map(([d,l])=>`<option value="${d}" ${d===days?'selected':''}>${l}</option>`).join('')}</select></label>
  <div class="kpis" style="margin-top:12px"><div class="card kpi"><b>${fmt(sum(ps.map(p=>p.amount)))}</b><span>Encaissé</span></div><div class="card kpi"><b>${stay('nuitee').length}</b><span>Nuitées (séjours) · ${fmt(rv('nuitee'))}</span></div><div class="card kpi"><b>${stay('passage').length}</b><span>Passages · ${fmt(rv('passage'))}</span></div></div>
  <div class="card"><b>Encaissements par mode de paiement</b><table>${Object.entries(METHODS).map(([k,v])=>`<tr><td>${v}</td><td class="r">${fmt(by(k))}</td></tr>`).join('')}</table></div>
  <p><button class="p" onclick="exportCSV()">Exporter en CSV (Excel)</button><button class="s" onclick="window.print()">Imprimer / PDF</button></p>
  <div class="card"><b>Sauvegarde des données</b><p class="muted">Les données sont enregistrées uniquement dans ce navigateur. Faites une sauvegarde régulièrement : vider les données du navigateur les efface.</p>
  <button class="p" style="margin-top:0" onclick="backup()">Télécharger la sauvegarde</button><label style="display:inline-block;margin-left:6px" class="muted">Restaurer<input type="file" accept=".json" onchange="restore(this)"></label></div>`;
}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
function exportCSV(){
  const from=now()-days*864e5,q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=[['Date','Chambre','Client','Séjour','Type','Mode','Montant']];
  S.payments.filter(p=>p.at>=from).forEach(p=>{const b=bk(p.b);rows.push([when(p.at),room(b.room)?.number,b.cust.name,b.stay,p.kind,METHODS[p.method],p.kind==='remboursement'?-p.amount:p.amount])});
  dl('innovastay-encaissements.csv','\ufeff'+rows.map(r=>r.map(q).join(';')).join('\n'),'text/csv');
}
function backup(){S.lastBackup=now();save();dl(`innovastay-sauvegarde-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(S),'application/json');render()}
function restore(inp){const f=inp.files[0];if(!f||!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?'))return;const fr=new FileReader();fr.onload=()=>{try{S=JSON.parse(fr.result);save();render()}catch{alert('Fichier de sauvegarde invalide.')}};fr.readAsText(f)}

  return `<p class="muted">Clients à problème (impayé, dégâts, vol…). Une alerte s'affiche à l'arrivée si le nom, le téléphone ou le numéro de pièce correspond. Ces informations sont personnelles : ne les gardez que si nécessaire.</p>
  <form class="card" style="max-width:560px" onsubmit="addWatch(event)"><div class="row"><label>Nom<input name="n"></label><label>Téléphone<input name="p" type="tel"></label></div><div class="row"><label>N° de pièce<input name="d"></label><label>Motif<input name="m" required placeholder="ex. parti sans payer"></label></div><button class="p">Ajouter à la liste</button></form>
  <div class="card scroll" style="margin-top:12px"><table>${S.watch.map((w,i)=>`<tr><td>${esc(w.name)}</td><td>${esc(w.phone)}</td><td>${esc(w.docNum)}</td><td>${esc(w.reason)}</td><td class="r"><button class="d" onclick="delWatch(${i})">Retirer</button></td></tr>`).join('')||'<tr><td class="muted">Liste vide.</td></tr>'}</table></div>`;
}
function addWatch(e){
  e.preventDefault();const f=e.target;
  if(!(f.n.value.trim()||f.p.value.trim()||f.d.value.trim()))return alert('Renseignez au moins un nom, un téléphone ou un numéro de pièce.');
  S.watch.push({name:f.n.value.trim(),phone:f.p.value.trim(),docNum:f.d.value.trim(),reason:f.m.value.trim()});save();render();
}
function delWatch(i){S.watch.splice(i,1);save();render()}

const b64d=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function activate(raw){
  const B='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567',up=String(raw).toUpperCase(),m=up.match(/\bIS((?:-[A-Z2-7]{1,6}){10,})/);
  let c=m?m[1].replace(/-/g,''):up.replace(/[^A-Z2-7]/g,'');
  if(!m&&c.length>116&&c.startsWith('IS'))c=c.slice(2);
  const out=[];let bits=0,val=0;
  for(const ch of c){val=(val<<5)|B.indexOf(ch);bits+=5;if(bits>=8){out.push((val>>(bits-8))&255);bits-=8;val&=(1<<bits)-1}}
  if(out.length!==72)return 'Code incomplet ou invalide. Collez le code en entier.';
  const pl=Uint8Array.from(out.slice(0,8)),sg=Uint8Array.from(out.slice(8));
  if(pl[0]!==1)return "Ce code n'est pas destiné à InnovaStay.";
  const days={0:30,1:365,2:180,3:7}[pl[1]];if(!days)return 'Code invalide.';
  let ok=false;
  try{const key=await crypto.subtle.importKey('raw',b64d(PUB),{name:'ECDSA',namedCurve:'P-256'},false,['verify']);ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,sg,pl)}
  catch(e){return "Vérification impossible sur ce navigateur. Utilisez un Chrome ou Edge récent."}
  if(!ok)return "Code invalide. Vérifiez qu'il est complet et sans modification.";
  const id=[...pl.slice(2)].map(x=>x.toString(16).padStart(2,'0')).join('');
  if(LIC.used.includes(id))return 'Ce code a déjà été utilisé sur cet appareil.';
  const t=now();LIC.exp=Math.max(t,LIC.exp)+days*864e5;LIC.used.push(id);LIC.last=Math.max(LIC.last,t);
  await kvSet('lic',LIC);return 'ok';
}
async function doActivate(e){
  e.preventDefault();const r=await activate(e.target.c.value);
  if(r!=='ok'){$('#lerr').textContent=r;return}
  toast('Licence activée jusqu\'au '+new Date(LIC.exp).toLocaleDateString('fr-FR'));render();
}

  let body;
  if(isNew)body=`<h2 style="margin:20px 0 6px">Bienvenue !</h2><p>Essayez InnovaStay <b>gratuitement pendant 7 jours</b>, sans code.</p>
   <button class="p" style="font-size:17px;padding:14px 22px" onclick="startTrial()">Commencer mon essai gratuit (7 jours)</button>
   <hr style="border:0;border-top:1px solid var(--line);margin:20px 0 10px"><p class="muted" style="margin:0">Après l'essai, choisissez votre licence : <b>1 mois (30 jours) 1 500 F</b> · <b>1 an 15 000 F</b></p>${buyBtns()}
   <details style="text-align:left"><summary>J'ai déjà un code d'activation</summary>${codeBox}</details>
   <p class="muted" style="margin:14px 0 0">Installer sur téléphone : sur Android, menu ⋮ puis « Installer l'application » ; sur iPhone (Safari), Partager puis « Sur l'écran d'accueil ».</p>${contacts()}`;
  else{
    const why=clock?"La date de cet appareil semble incorrecte. Remettez la bonne date, puis rechargez la page.":trialEnded?'Votre essai gratuit de 7 jours est terminé.':`Votre licence a expiré le ${new Date(LIC.exp).toLocaleDateString('fr-FR')}.`;
    body=`<h2 style="margin:20px 0 6px">${why}</h2>${clock?'':`<p>Pour continuer : <b>1 mois (30 jours) 1 500 F</b> · <b>1 an 15 000 F</b></p>${buyBtns()}`}${codeBox}${contacts()}${backupBtn}`;
  }
  $('#app').innerHTML=`<div class="card" style="max-width:600px;margin:18px auto;text-align:center">${brandBlock()}${body}</div>`;
}
const bannerLic=()=>licDays()<=7?`<div class="alert" style="border-color:var(--sun);background:#fff8e0">${LIC.used.length?`<b>Votre licence expire dans ${licDays()} jour(s).</b> Demandez votre nouveau code :`:`<b>Essai gratuit : il vous reste ${licDays()} jour(s).</b> Pour continuer, demandez votre code de licence :`}${buyBtns()}</div>`:'';
function sLic(){
  const trial=!LIC.used.length;
  return `<div class="card" style="max-width:640px"><p><b>${trial?'Essai gratuit en cours':'Licence active'} jusqu'au ${new Date(LIC.exp).toLocaleDateString('fr-FR')}</b> (${licDays()} jour(s) restant(s))</p>
  <p>Licences : <b>1 mois (30 jours) 1 500 F</b> · <b>1 an 15 000 F</b></p>${buyBtns()}${codeBox}<p class="muted">Un nouveau code s'ajoute au temps restant : vous ne perdez aucun jour.</p>${contacts()}</div>`;
}

/* ===== Installation (PWA) ===== */
let DEFERRED=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFERRED=e;const b=$('#inst');if(b)b.hidden=false});
async function installApp(){if(!DEFERRED)return;DEFERRED.prompt();await DEFERRED.userChoice;DEFERRED=null;$('#inst').hidden=true}
window.addEventListener('appinstalled',()=>{const b=$('#inst');if(b)b.hidden=true;toast('Application installée')});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ===== Démarrage ===== */
Promise.all([load(),kvGet('lic')]).then(([s,l])=>{if(s)S={...S,...s};S.cfg=mergeCfg(S.cfg);if(l)LIC={...LIC,...l};
  if(!LIC.exp&&!LIC.started){const t=now();LIC={...LIC,exp:t+7*864e5,started:t,last:t,welcome:true};kvSet('lic',LIC)}
  render();navigator.storage?.persist?.()});
setInterval(()=>{if(tab==='dash'&&!$('#dlg').open)render()},30000);
</script>
</body>
</html>
